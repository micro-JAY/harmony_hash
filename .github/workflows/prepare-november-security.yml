name: Prepare dependency security update
on:
  push:
    branches: [chore/november-dependency-security]
    paths:
      - '.github/workflows/prepare-november-security.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inventory current lockfile
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-before.json" || test "$?" -eq 1
          node -e 'const a=require(process.env.RUNNER_TEMP+"/audit-before.json"); console.log(a.metadata.vulnerabilities); for(const [k,v] of Object.entries(a.vulnerabilities)) console.log(k,v.range,JSON.stringify(v.fixAvailable))'
      - name: Resolve security updates without package scripts
        run: |
          npm pkg set devDependencies.wrangler=4.153.0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || test "$?" -eq 1
          npm audit --json > "$RUNNER_TEMP/audit-after.json" || test "$?" -eq 1
          npm audit --omit=dev --json > "$RUNNER_TEMP/runtime-audit.json" || test "$?" -eq 1
          node -e 'for(const n of ["audit-after","runtime-audit"]) {const a=require(process.env.RUNNER_TEMP+"/"+n+".json");console.log(n,a.metadata.vulnerabilities);for(const [k,v] of Object.entries(a.vulnerabilities)) console.log(k,v.range,JSON.stringify(v.fixAvailable))}'
          git diff -- package.json package-lock.json
      - name: Save manifests and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-lockfile
          retention-days: 3
          path: |
            package.json
            package-lock.json
            ${{ runner.temp }}/audit-before.json
            ${{ runner.temp }}/audit-after.json
            ${{ runner.temp }}/runtime-audit.json
