    <meta name="theme-color" content="#09090b" />
    <script>
      (() => {
        const preferenceKey = "hh:appearance:v1";
        let appearance = "dark";
        try {
          const storedAppearance = window.localStorage.getItem(preferenceKey);
          if (storedAppearance === "dark" || storedAppearance === "light") {
            appearance = storedAppearance;
          }
        } catch {
          // A blocked storage API must not prevent the dark-default shell.
        }
        document.documentElement.dataset.theme = appearance;
        document.documentElement.style.colorScheme = appearance;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", appearance === "light" ? "#F0EDE8" : "#09090b");
      })();
    </script>
